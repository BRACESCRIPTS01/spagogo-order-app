<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Kitchen — Fatima Spagogo</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="robots" content="noindex">
        <link rel="icon" type="image/svg+xml" href="logo.svg">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="staffPage">
        <header class="siteHeader">
            <a href="index.html"><img src="logo.svg" alt="Fatima Spagogo" width="56" height="56"></a>
            <h1>Kitchen</h1>
            <p id="staffStatus">Checking access…</p>
        </header>

        <!-- Staff login: same accounts as the ordering page, but only accounts on
             the staff list get past the server function. -->
        <form id="staffLoginForm" class="staffLogin hidden">
            <div>
                <label for="staffEmail">Email:</label>
                <input type="email" id="staffEmail" name="email" autocomplete="username" required>
            </div>
            <div>
                <label for="staffPassword">Password:</label>
                <input type="password" id="staffPassword" name="password" autocomplete="current-password" required>
            </div>
            <p id="staffLoginMessage" aria-live="polite"></p>
            <button type="submit" id="staffLoginBtn">Log in</button>
        </form>

        <section id="staffBoard" class="staffBoard hidden">
            <div class="staffToolbar">
                <div class="staffFilters" role="group" aria-label="Which orders">
                    <button type="button" class="staffFilter isActive" data-range="today">Today</button>
                    <button type="button" class="staffFilter" data-range="all">All</button>
                    <label class="staffOnlyOpen"><input type="checkbox" id="staffOnlyOpen" checked> Open only</label>
                </div>
                <div class="staffTools">
                    <span id="staffCount" class="staffCount"></span>
                    <button type="button" id="staffRefreshBtn" class="staffSmallBtn">Refresh</button>
                    <button type="button" id="staffLogoutBtn" class="staffSmallBtn">Log out</button>
                </div>
            </div>
            <p id="staffMessage" class="staffMessage" aria-live="polite"></p>
            <div id="staffKanban" class="staffKanban">
                <div class="kanban-column">
                    <h2>New / Pending</h2>
                    <ul id="col-new" class="staffList"></ul>
                </div>
                <div class="kanban-column">
                    <h2>Preparing</h2>
                    <ul id="col-preparing" class="staffList"></ul>
                </div>
                <div class="kanban-column">
                    <h2>Done / Delivering</h2>
                    <ul id="col-done" class="staffList"></ul>
                </div>
            </div>
        </section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js" integrity="sha384-JBR+x8blGwjDRO63aHCGiZMD4VNiTR4ZUGA+N6ZKLf3zNt1fK8IBpcgPaMrxqWBp" crossorigin="anonymous"></script>
        <script src="supabase-init.js"></script>
        <script src="staff.js"></script>
        </body>
</html>
