<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>My Orders — Fatima Spagogo</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/svg+xml" href="logo.svg">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="siteHeader">
            <a href="index.html"><img src="logo.svg" alt="Fatima Spagogo" width="56" height="56"></a>
            <h1>My Orders</h1>
            <p id="ordersStatus">Loading your orders…</p>
        </header>

        <section id="ordersPanel" class="ordersPanel hidden">
            <div class="pointsSummary">
                <span class="pointsLabel">Points earned</span>
                <span id="pointsTotal" class="pointsTotal">0</span>
                <span class="pointsHint">1 point per ₦100 on approved orders</span>
            </div>
            <ul id="ordersList" class="ordersList"></ul>
            <p class="backLink"><a href="index.html">← Back to ordering</a></p>
        </section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js" integrity="sha384-JBR+x8blGwjDRO63aHCGiZMD4VNiTR4ZUGA+N6ZKLf3zNt1fK8IBpcgPaMrxqWBp" crossorigin="anonymous"></script>
        <script src="supabase-init.js"></script>
        <script src="orders.js"></script>
    </body>
</html>
